name: keepalive
# Pings the Render free instance so it does not spin down.
# Note: GitHub disables scheduled workflows after 60 days without repository activity — re-enable in the Actions tab (or push a commit) if that happens.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /healthz
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 https://pattaya-flood-center.onrender.com/healthz; then echo; echo "awake"; exit 0; fi
            echo "attempt $i failed, retrying"; sleep 20
          done
          exit 1
